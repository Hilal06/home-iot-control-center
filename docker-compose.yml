services:
  # ==========================================
  # 1. MESSAGE BROKER (MQTT)
  # ==========================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./Service_Backend/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot_public_net

  # ==========================================
  # 2. IN-MEMORY MESSAGE BUS & CACHE (REDIS)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: iot_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-iot_redis_secure_pass_2026}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-iot_redis_secure_pass_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - iot_internal_net

  # ==========================================
  # 3. DATABASE (TIMESCALE / POSTGRESQL)
  # ==========================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: iot_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-home_iot_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./Service_Backend/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-iot_admin} -d $${POSTGRES_DB:-home_iot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - iot_internal_net

  # ==========================================
  # 4. RUST EDGE INGESTION GATEWAY (PORT 8080)
  # ==========================================
  edge-ingestion:
    build:
      context: ./Service_Backend
      dockerfile: Dockerfile
    container_name: iot_edge_ingestion_rust
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://${POSTGRES_USER:-iot_admin}:${POSTGRES_PASSWORD:-iot_secret_password}@timescaledb:5432/${POSTGRES_DB:-home_iot_db}
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - MQTT_CLIENT_ID=home_iot_backend
      - MQTT_TELEMETRY_TOPIC=home/sensors/telemetry
      - MQTT_COMMAND_TOPIC=home/actuators/control
      - REDIS_URL=redis://:${REDIS_PASSWORD:-iot_redis_secure_pass_2026}@redis:6379
      - IOT_ADMIN_KEY=${IOT_ADMIN_KEY:-iot_admin_secret_key_2026}
      - RUST_LOG=home_iot_backend=info,tower_http=debug
    ports:
      - "${EDGE_PORT:-8080}:8080"
    networks:
      - iot_public_net
      - iot_internal_net

  # ==========================================
  # 5. SPRING BOOT BUSINESS ENGINE (PORT 8081)
  # ==========================================
  business-engine:
    build:
      context: ./Service_Business_Java
      dockerfile: Dockerfile
    container_name: iot_business_engine_springboot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-iot_redis_secure_pass_2026}
      - IOT_ADMIN_KEY=${IOT_ADMIN_KEY:-iot_admin_secret_key_2026}
      - DATABASE_URL=jdbc:postgresql://timescaledb:5432/${POSTGRES_DB:-home_iot_db}
      - DATABASE_USER=${POSTGRES_USER:-iot_admin}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-iot_secret_password}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - JAVA_TOOL_OPTIONS=-XX:+UseG1GC -XX:MaxRAMPercentage=75.0
    ports:
      - "${BUSINESS_PORT:-8081}:8081"
    networks:
      - iot_public_net
      - iot_internal_net

  # ==========================================
  # 6. SVELTE SCADA DASHBOARD UI (PORT 5173 / 80)
  # ==========================================
  dashboard:
    build:
      context: ./Dashboard
      dockerfile: Dockerfile
    container_name: iot_dashboard_ui
    restart: unless-stopped
    depends_on:
      - edge-ingestion
      - business-engine
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    networks:
      - iot_public_net

volumes:
  timescaledb_data:
  mosquitto_data:
  mosquitto_log:
  redis_data:

networks:
  iot_public_net:
    name: iot_public_network
    driver: bridge

  iot_internal_net:
    name: iot_internal_network
    driver: bridge

