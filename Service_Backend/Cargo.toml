[package]
name = "home-iot-backend"
version = "0.1.0"
edition = "2021"
authors = ["Home IoT Developer"]
description = "High-performance IoT Gateway Backend for ESP32 Master and Home Automation"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rumqttc = "0.24"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "macros", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
anyhow = "1.0"
redis = { version = "0.27", features = ["tokio-comp"] }
