# Eclipse Mosquitto Configuration for Home IoT Service

listener 1883 0.0.0.0
allow_anonymous true

# WebSocket Listener (disabled - frontend uses backend WS proxy on /api/ws)
# listener 9001 127.0.0.1
# protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
