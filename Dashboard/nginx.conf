server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Security Headers (Clickjacking, MIME Sniffing & CSP)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self';" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy to Rust Edge Ingestion Gateway (WebSocket & Direct Telemetry)
    location /api/ws {
        proxy_pass http://edge-ingestion:8080/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://edge-ingestion:8080/api/;
        proxy_set_header Host $host;
    }

    # Proxy to Spring Boot Business Engine (Analytics & Rules)
    location /api/v1/business/ {
        proxy_pass http://business-engine:8081/api/v1/business/;
        proxy_set_header Host $host;
    }
}

